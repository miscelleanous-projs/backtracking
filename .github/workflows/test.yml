name: Test

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Run tests
      run: cargo test --all-targets --verbose
    - name: Run tests (parallel feature)
      run: cargo test --all-targets --features parallel --verbose
    # --all-targets deliberately excludes doctests, so the crate level example in src/lib.rs --
    # the first thing a docs.rs visitor reads -- needs a step of its own or it is never compiled.
    - name: Run doc tests
      run: cargo test --doc --features parallel --verbose
    - name: Run knights-journey
      run: cargo run --example knights_journey --release
    - name: Run sudoku
      run: cargo run --example sudoku --release
    - name: Run word_chain
      run: cargo run --example word_chain --release --features parallel
